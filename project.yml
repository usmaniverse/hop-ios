# Generates Hop.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The project file is not committed; run `xcodegen generate` after cloning.
name: Hop
options:
  bundleIdPrefix: online.usmaniverse
  deploymentTarget:
    iOS: "17.0"
packages:
  HopKit:
    path: Packages/HopKit
targets:
  Hop:
    type: application
    platform: iOS
    sources: [App/Hop]
    dependencies:
      - package: HopKit
        product: HopCore
      - package: HopKit
        product: HopData
      - package: HopKit
        product: RideHistoryFeature
      - package: HopKit
        product: BookingFeature
    scheme: {}
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
